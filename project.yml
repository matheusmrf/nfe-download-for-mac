name: NFeDownloadForMAC
options:
  minimumXcodeGenVersion: 2.45.2
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: NFeDownloadForMacApp
    PRODUCT_BUNDLE_IDENTIFIER: com.matheusmrf.nfedownloadformac
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: NFe Download For Mac
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Matheus Figueiredo
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  NFeDownloadForMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/NFeDownloadForMacApp
    settings:
      base:
        PRODUCT_MODULE_NAME: NFeDownloadForMacApp
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableDescription: App macOS para download e envio de XMLs fiscais.
    scheme:
      testTargets: []
